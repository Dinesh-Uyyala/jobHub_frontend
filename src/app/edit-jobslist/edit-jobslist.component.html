<body>
<div class="edit-job-dark container">
    <h2>Edit Job</h2>
  
    <div *ngIf="loading">Loading job details...</div>
  
    <form *ngIf="!loading" (submit)="updateJob()">
      <div class="form-group">
        <label for="jobTitle">Job Title</label>
        <input type="text" id="jobTitle" [(ngModel)]="job.JobTitle" name="jobTitle" class="form-control" required />
      </div>
  
      <div class="form-group">
        <label for="location">Location</label>
        <input type="text" id="location" [(ngModel)]="job.Location" name="Location" class="form-control" required />
      </div>
  
      <div class="form-group">
        <label for="qualification">Qualification</label>
        <input type="text" id="qualification" [(ngModel)]="job.Qualification" name="Qualification" class="form-control" required />
      </div>
  
      <div class="form-group">
        <label for="skills">Skills</label>
        <input type="text" id="skills" [(ngModel)]="job.Skills" name="Skills" class="form-control" required />
      </div>
  
      <div class="form-group">
        <label for="description">Job Description</label>
        <textarea id="description" [(ngModel)]="job.JobDescription" name="JobDescription" class="form-control" rows="4" required></textarea>
      </div>
  
      <button type="submit" class="btn btn-primary">Update Job</button>
      <button type="button" class="btn btn-secondary" (click)="cancelEdit()">Cancel</button>
    </form>
  </div>
</body>
