<div class="container">
  <h2>Edit Profile</h2>

  <!-- ✅ Error message if data fails to load -->
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <!-- ✅ Show loading message while fetching data -->
  <div *ngIf="loading">Loading profile details...</div>

  <!-- ✅ Show form only when data is available -->
  <form *ngIf="!loading && user" (ngSubmit)="updateProfile()">
    
    <div class="form-group">
      <label>Full Name:</label>
      <input type="text" [(ngModel)]="user.FullName" name="FullName" class="form-control" required>
    </div>

    <div class="form-group">
      <label>Email:</label>
      <input type="email" [(ngModel)]="user.Email" name="Email" class="form-control" disabled>
    </div>

    <div class="form-group">
      <label>Phone:</label>
      <input type="text" [(ngModel)]="user.Phone" name="Phone" class="form-control" required>
    </div>

    <div class="form-group">
      <label>Resume (URL):</label>
      <input type="text" [(ngModel)]="user.Resume" name="Resume" class="form-control">
    </div>

    <div class="form-group">
      <label>Skills:</label>
      <input type="text" [(ngModel)]="user.Skills" name="Skills" class="form-control">
    </div>

    <div class="form-group">
      <label>Education:</label>
      <input type="text" [(ngModel)]="user.Education" name="Education" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">Update Profile</button>
    <button type="button" class="btn btn-secondary" (click)="cancelEdit()">Cancel</button>

  </form>
</div>
