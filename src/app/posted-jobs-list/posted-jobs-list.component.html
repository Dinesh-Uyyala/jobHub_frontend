<div class="job-list-container">
  <h2>My Posted Jobs</h2>

  <!-- ← wrap the whole list here -->
  <div class="jobs-scroll">
    <ng-container *ngIf="jobs.length > 0; else noJobs">
      <div *ngFor="let job of jobs" class="job-card">
        <h3>{{ job.JobTitle }}</h3>
        <p><strong>Company:</strong> {{ job.company }}</p>
        <p><strong>Location:</strong> {{ job.Location }}</p>
        <p><strong>Qualification:</strong> {{ job.Qualification }}</p>
        <p><strong>Skills:</strong> {{ job.Skills }}</p>
        <p><strong>Description:</strong> {{ job.JobDescription }}</p>
        <p><strong>Salary:</strong> {{ job.Salary }}</p>
        <p><strong>Experience:</strong> {{ job.Experiance }}</p>

        <div class="btn-group">
          <button class="edit-btn" (click)="editJob(job)">✏️ Edit</button>
          <button class="delete-btn" (click)="deleteJob(job.id)">🗑️ Delete</button>
        </div>
      </div>
    </ng-container>

    <ng-template #noJobs>
      <p>No jobs posted yet.</p>
    </ng-template>
  </div>
  <!-- → end scroll wrapper -->

  <button class="back-btn" (click)="goBack()">← Back to Dashboard</button>
</div>
