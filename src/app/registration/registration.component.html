 <section class="h-100 h-custom" style="background-color: #8fc4b7;">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-lg-8 col-xl-6">
        <div class="card rounded-3">
          <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/img3.webp"
            class="w-100" style="border-top-left-radius: .3rem; border-top-right-radius: .3rem;"
            alt="Sample photo">
          <div class="card-body p-4 p-md-5">
            <h4 class="mb-4 pb-2 pb-md-0 mb-md-5 px-md-2">Registration Info</h4>

            <form class="px-md-2">

              <div data-mdb-input-init class="form-outline mb-4">
                <input type="text" id="form3Example1q" class="form-control" name="name"[(ngModel)]="user.name" />
                <label class="form-label" for="form3Example1q">Name</label>
              </div>

              <div class="row">
                <div class="col-md-6 mb-4">

                  <div data-mdb-input-init class="form-outline datepicker">
                    <input type="text" class="form-control" name="email"[(ngModel)]="user.email" id="exampleDatepicker1" />
                    <label for="exampleDatepicker1" class="form-label">email</label>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-4">

                  <div data-mdb-input-init class="form-outline">
                    <input type="text" id="form3Example1w" class="form-control" name="password"[(ngModel)]="user.password" />
                    <label class="form-label" for="form3Example1w">password</label>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-4">

                  <div data-mdb-input-init class="form-outline-1">
                    <input type="text" id="form3Example1" class="form-control" name=" enter password again"[(ngModel)]="user.enterpasswordagain" />
                    <label class="form-label" for="form3Example1"> enter password again</label>
                  </div>
                </div>
              </div>
                
              <button routerLink="/register" class="btn">Register</button>

            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
